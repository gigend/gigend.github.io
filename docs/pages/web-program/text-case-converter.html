<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigend</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../../styles.css">
</head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #6366f1;
      --primary-2: #22c55e;
      --border: #e5e7eb;
      --shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .dark {
      --bg: #0b1220;
      --card: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-2: #34d399;
      --border: #1f2933;
      --shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }



    .app {
      width: 100%;
      max-width: 1100px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px 28px 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
      transition: background .3s ease;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text);
      transition: background .2s ease, border .2s ease;
    }

    .toggle:hover { background: rgba(99,102,241,0.08); }

    .toggle input { display: none; }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .panel label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 240px;
      resize: vertical;
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.5;
      outline: none;
      transition: border .2s ease, box-shadow .2s ease, background .3s ease;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease, border .2s ease, color .2s ease;
    }

    button:hover {
      background: rgba(99,102,241,0.1);
      border-color: var(--primary);
      color: var(--primary);
    }

    button:active { transform: scale(0.97); }

    .primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #ffffff;
      border: none;
    }

    .primary:hover { filter: brightness(1.05); color: #ffffff; }

    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .left-actions, .right-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
    }
	
	.counter {
	display: flex;
	gap: 16px;
	flex-wrap: wrap;
	font-size: 0.85rem;
	color: var(--muted);
	margin-top: 4px;
	}

	.counter span {
	background: var(--bg);
	padding: 6px 12px;
	border-radius: 999px;
	border: 1px solid var(--border);
	}

  </style>


<body>
  <div class="container">

    <div id="navbar"></div>
    <div class="pages">
    <!-- Header section -->
    <header>
      <h1><span class="highlight">Text Case</span> Converter</h1>
      <p class="subtitle"><b>@gigend</b> / Program untuk merubah berbagai huruf atau teks jadi besar, kecil, dan sebagainya. </p>
    </header>

  <div class="app" id="app">
     <!--<header>
     <<div class="title-wrap">
        <h1>Text Case Converter</h1>
        <div class="subtitle">Instantly change text case with modern UI & dark mode</div>
      </div>
      <div class="controls-right">
        <!--<label class="toggle">
          <input type="checkbox" id="darkToggle">
          🌙 Dark Mode
        </label>
      </div>
    </header>-->

    <div class="main">
      <div class="panel">
        <label for="inputText">Input</label>
        <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
      </div>

      <div class="panel">
        <label for="outputText">Output</label>
        <textarea id="outputText" placeholder="Converted text will appear here..."></textarea>
      </div>
    </div>

    <div class="buttons">
      <button onclick="convert('sentence')">Sentence case</button>
      <button onclick="convert('lower')">lower case</button>
      <button onclick="convert('upper')">UPPER CASE</button>
      <button onclick="convert('capitalized')">Capitalized Case</button>
      <button onclick="convert('alternating')">aLtErNaTiNg cAsE</button>
      <button onclick="convert('title')">Title Case</button>
      <button onclick="convert('inverse')">InVeRsE CaSe</button>
    </div>

<div class="footer-actions">
  <div class="left-actions">
    <button class="primary" onclick="copyText()">Copy to Clipboard</button>
    <button onclick="downloadText()">Download Text</button>
  </div>
  <div class="right-actions">
    <button onclick="clearText()">Clear</button>
  </div>
</div>

<div class="counter" id="counter">
  <span><strong>Lines:</strong> <span id="lineCount">0</span></span>
  <span><strong>Words:</strong> <span id="wordCount">0</span></span>
  <span><strong>Chars:</strong> <span id="charCount">0</span></span>
  <span><strong>Chars (no spaces):</strong> <span id="charNoSpaceCount">0</span></span>
</div>

<div class="hint">Tip: You can edit the output text manually before copying or downloading.</div>

  </div>

  <script>
    const inputText = document.getElementById('inputText');
		inputText.addEventListener('input', () => {
		updateCounter(inputText.value);
	});

    const outputText = document.getElementById('outputText');
    const darkToggle = document.getElementById('darkToggle');
    const app = document.getElementById('app');
	const lineCountEl = document.getElementById('lineCount');
	const wordCountEl = document.getElementById('wordCount');
	const charCountEl = document.getElementById('charCount');
	const charNoSpaceCountEl = document.getElementById('charNoSpaceCount');

    // Load saved theme
	const savedTheme = localStorage.getItem('theme');

	if (savedTheme === 'light') {
	document.body.classList.remove('dark');
	darkToggle.checked = false;
	} else {
	// default dark
	document.body.classList.add('dark');
	darkToggle.checked = true;
	}

    darkToggle.addEventListener('change', () => {
      document.body.classList.toggle('dark');
      const mode = document.body.classList.contains('dark') ? 'dark' : 'light';
      localStorage.setItem('theme', mode);
    });

    function convert(type) {
      const text = inputText.value;
      let result = '';

      switch (type) {
        case 'sentence':
          result = text
            .toLowerCase()
            .replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
          break;

        case 'lower':
          result = text.toLowerCase();
          break;

        case 'upper':
          result = text.toUpperCase();
          break;

        case 'capitalized':
          result = text.replace(/\b\w/g, c => c.toUpperCase());
          break;

        case 'alternating':
          let alt = true;
          result = '';
          for (let char of text) {
            if (/[a-zA-Z]/.test(char)) {
              result += alt ? char.toLowerCase() : char.toUpperCase();
              alt = !alt;
            } else {
              result += char;
            }
          }
          break;

        case 'title':
          result = text
            .toLowerCase()
            .replace(/\b\w/g, c => c.toUpperCase());
          break;

        case 'inverse':
          result = '';
          for (let char of text) {
            if (char === char.toUpperCase()) {
              result += char.toLowerCase();
            } else {
              result += char.toUpperCase();
            }
          }
          break;
      }

		outputText.value = result;
		updateCounter(result);

    }

    function copyText() {
      if (!outputText.value) return;
      outputText.select();
      document.execCommand('copy');
      alert('Text copied to clipboard!');
    }

    function downloadText() {
      if (!outputText.value) return;
      const blob = new Blob([outputText.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted-text.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

function clearText() {
  inputText.value = '';
  outputText.value = '';
  updateCounter('');
}

	
function updateCounter(text) {
  // Lines
  const lines = text.length > 0 ? text.split('\n').length : 0;

  // Characters
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g, '').length;

  // Words
  const words = text
    .trim()
    .split(/\s+/)
    .filter(word => word.length > 0).length;

  lineCountEl.textContent = lines;
  wordCountEl.textContent = words;
  charCountEl.textContent = chars;
  charNoSpaceCountEl.textContent = charsNoSpace;
}

  </script>

<div class="divider"></div>

<div id="footer"></div>

</div>

<script src="../../main.js"></script>

</body>

</html>
